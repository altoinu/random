<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2次関数ジャンプのデモ (v6.0 Final)</title>
    <style>
        /* CSSは変更ありません */
        body { font-family: sans-serif; text-align: center; }
        #game-world {
            position: relative;
            width: 800px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid #000;
            background-color: #e0f7fa;
            overflow: hidden;
        }
        #parabola-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30px;
            background-color: #4caf50;
            z-index: 2;
        }
        #character {
            position: absolute;
            bottom: 30px;
            left: 50px;
            width: 30px;
            height: 30px;
            background-color: #f44336;
            z-index: 3;
        }
        #controls { margin-bottom: 10px; display: inline-block; text-align: left; padding: 10px; border: 1px solid #ccc; border-radius: 8px;}
        .control-group { margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; margin-top: 8px; }
        .slider-container span { min-width: 40px; text-align: right; margin-left: 10px; font-weight: bold; }
        p { font-size: 1.2em; }
        #instructions { font-size: 0.9em; color: #555; margin-top: 10px; }
        .coordinate-text {
            position: absolute;
            font-size: 14px;
            color: #d32f2f;
            font-weight: bold;
            pointer-events: none;
            z-index: 4;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 2px;
            border-radius: 3px;
        }
        .coordinate-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff9800; /* オレンジ色 */
            border-radius: 50%; /* 円にする */
            border: 1px solid #fff;
            pointer-events: none;
            z-index: 5; /* テキストより手前に表示 */
            transform: translate(-50%, -50%); /* 要素の中心が座標に合うように調整 */
        }
        .vertex-text {
            position: absolute;
            font-size: 15px;
            color: #2e7d32; /* 緑色 */
            font-weight: bold;
            pointer-events: none;
            z-index: 6;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 3px;
            border-radius: 3px;
            border: 1px solid #2e7d32;
        }
        .vertex-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #66bb6a; /* 緑色 */
            border-radius: 50%;
            border: 2px solid #fff;
            pointer-events: none;
            z-index: 7; /* 他のどの要素よりも手前に表示 */
            transform: translate(-50%, -50%); /* 要素の中心が座標に合うように調整 */
        }
        .landing-text {
            position: absolute;
            font-size: 14px;
            color: #6a1b9a; /* 紫色 */
            font-weight: bold;
            pointer-events: none;
            z-index: 4;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 2px;
            border-radius: 3px;
        }
        .landing-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ab47bc; /* 紫色 */
            border-radius: 50%;
            border: 1px solid #fff;
            pointer-events: none;
            z-index: 5;
            transform: translate(-50%, -50%);
        }
        #target-coin {
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #ffeb3b; /* 黄色 */
            border: 2px solid #fbc02d;
            border-radius: 50%;
            left: 387.5px; /* 中央に配置 */
            bottom: 130px; /* 初期位置 (JSで動的に設定されます) */
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #a1887f;
        }
        #discriminant-controls { 
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #ccc;
        }
        #discriminant-result {
            margin-top: 10px;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 5px;
            min-height: 50px;
            text-align: center;
            font-size: 1.1em;
        }

        /* ★★★ ここから追加 ★★★ */
        .hill {
            position: absolute;
            bottom: 30px;
            left: 150px;
            width: 200px;
            height: 100px;
            background-color: #a5d6a7;
            border-radius: 100px 100px 0 0;
            z-index: 1;
        }
        .bush {
            position: absolute;
            bottom: 30px;
            width: 120px;
            height: 40px;
            background-color: #81c784;
            border-radius: 20px;
            z-index: 1;
        }
        .bush-1 { left: 450px; }
        .bush-2 { left: 650px; width: 80px; }
        
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 100px;
            z-index: 1;
        }
        .cloud:before, .cloud:after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 100px;
        }
        .cloud-1 {
            top: 80px;
            left: 100px;
            width: 100px;
            height: 30px;
        }
        .cloud-1:before {
            top: -15px;
            left: 10px;
            width: 50px;
            height: 50px;
        }
        .cloud-1:after {
            top: -25px;
            left: 40px;
            width: 60px;
            height: 60px;
        }
        .cloud-2 {
            top: 60px;
            right: 120px;
            width: 120px;
            height: 40px;
        }
        .cloud-2:before {
            top: -20px;
            left: 15px;
            width: 60px;
            height: 60px;
        }
         /* ★★★ ここまで追加 ★★★ */
    </style>
</head>
<body>
    <h2>2次関数ジャンプのデモ</h2>
    <p id="equationDisplay">ジャンプの軌道 (2次関数): <code>y = -1.0x² + 6.0x - 5.0</code></p>
    <div id="controls">
        <div class="control-group">
            <button id="jumpButton">ジャンプ (Space)</button>
            <button id="resetButton">リセット</button>
            <button id="parabolaButton">放物線を描画: OFF</button>
            <button id="coordButton">座標を表示: OFF</button>
        </div>
        <div class="slider-container">
            a (x²の係数, 重力): <input type="range" id="aSlider" min="-2" max="-0.1" step="0.1" value="-1">
            <span id="aValue">-1.0</span>
        </div>
        <div class="slider-container">
            b (xの係数, 初速): <input type="range" id="bSlider" min="1" max="15" step="0.5" value="6">
            <span id="bValue">6.0</span>
        </div>
        <div class="slider-container">
            c (定数項, 開始高さ): <input type="range" id="cSlider" min="-15" max="0" step="0.5" value="-5">
            <span id="cValue">-5.0</span>
        </div>
        <div id="discriminant-controls">
            <p>コインの高さ (y=0) に届くか？</p>
            <button id="calculateD">判別式 D = b²-4ac を計算</button>
            <div id="discriminant-result">
                ↑のボタンを押して結果を確認
            </div>
        </div>
    </div>
    <p id="instructions">
        キーボードの **← →** で左右移動、**Space** キーでジャンプ！
    </p>
    <p>
        時間 (x): <span id="timeDisplay">0.00</span>
        / 相対的な高さ (y): <span id="heightDisplay">0.00</span>
    </p>
    
    <div id="game-world">
        <!-- ★★★ ここから追加 ★★★ -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="hill"></div>
        <div class="bush bush-1"></div>
        <div class="bush bush-2"></div>
        <!-- ★★★ ここまで追加 ★★★ -->
        <div id="target-coin">0</div>
        <canvas id="parabola-canvas"></canvas>
        <div id="ground"></div>
        <div id="character"></div>
    </div>

    <script>
        // --- 数学の変数と係数 (y = ax^2 + bx + c) ---
        let a = -1;  // x^2の係数。マイナスなので上に凸(山なり)の放物線になる。
        let b = 6;   // xの係数。ジャンプの初速を決め、値が大きいほど高く飛ぶ。
        let c = -5;  // ★★★ constからletに変更し、初期値を-5に ★★★ 定数項。コインを基準(y=0)としたジャンプの開始高さ。
        let x = 0;   // 2次関数の変数 'x' (ジャンプ開始からの時間)。
        // つまり、このプログラムは y = ax^2 + bx + c の式を元に動いている。

        // --- ゲームとしての見た目を調整する設定 ---
        const GROUND_Y_PX = 30; // 地面のCSS上の高さ(ピクセル)
        const HORIZONTAL_SPEED = 4; // 左右移動のスピード
        const Y_SCALE = 20; // y座標の1単位を何ピクセルで表示するかの縮尺
        const COIN_BASE_Y_PX = 130; // 地面からコイン(y=0)までのピクセル距離

        // --- HTML要素の取得 ---
        const gameWorld = document.getElementById('game-world');
        const character = document.getElementById('character');
        const jumpButton = document.getElementById('jumpButton');
        const resetButton = document.getElementById('resetButton');
        const parabolaButton = document.getElementById('parabolaButton');
        const coordButton = document.getElementById('coordButton');
        const timeDisplay = document.getElementById('timeDisplay');
        const heightDisplay = document.getElementById('heightDisplay');
        const canvas = document.getElementById('parabola-canvas');
        const ctx = canvas.getContext('2d');
        const equationDisplay = document.getElementById('equationDisplay');
        const aSlider = document.getElementById('aSlider');
        const aValue = document.getElementById('aValue');
        const bSlider = document.getElementById('bSlider');
        const bValue = document.getElementById('bValue');
        const cSlider = document.getElementById('cSlider');
        const cValue = document.getElementById('cValue');
        const calculateDButton = document.getElementById('calculateD');
        const discriminantResult = document.getElementById('discriminant-result');
        const targetCoin = document.getElementById('target-coin');

        // --- 状態を保存する変数 ---
        let isJumping = false;
        let animationFrameId = null;
        let currentHorizontalPos = 50;
        let jumpHorizontalVelocity = 0;
        let keysPressed = {};
        let drawParabola = false;
        let showCoordinates = false;
        let loggedIntegers = {};
        let isVertexLogged = false;
        let isLandingLogged = false;

        // --- 初期化処理 ---
        canvas.width = gameWorld.offsetWidth;
        canvas.height = gameWorld.offsetHeight;
        
        // --- イベントリスナー ---
        document.addEventListener('keydown', (e) => {
            keysPressed[e.key] = true;
            if (e.key === ' ' && !isJumping) {
                e.preventDefault();
                startJump();
            }
        });

        document.addEventListener('keyup', (e) => {
            delete keysPressed[e.key];
        });

        jumpButton.onclick = startJump;
        resetButton.onclick = resetJump;

        parabolaButton.onclick = () => {
            drawParabola = !drawParabola;
            parabolaButton.innerText = `放物線を描画: ${drawParabola ? 'ON' : 'OFF'}`;
            if (!drawParabola) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        };

        coordButton.onclick = () => {
            showCoordinates = !showCoordinates;
            coordButton.innerText = `座標を表示: ${showCoordinates ? 'ON' : 'OFF'}`;
            if (!showCoordinates) {
                document.querySelectorAll('.coordinate-text, .coordinate-dot, .vertex-text, .vertex-dot, .landing-text, .landing-dot').forEach(el => el.remove());
            }
        };

        aSlider.addEventListener('input', (e) => {
            a = parseFloat(e.target.value);
            aValue.textContent = a.toFixed(1);
            updateEquationDisplay();
            resetJump();
        });

        bSlider.addEventListener('input', (e) => {
            b = parseFloat(e.target.value);
            bValue.textContent = b.toFixed(1);
            updateEquationDisplay();
            resetJump();
        });
        
        cSlider.addEventListener('input', (e) => {
            c = parseFloat(e.target.value);
            cValue.textContent = c.toFixed(1);
            updateEquationDisplay();
            resetJump();
        });

        calculateDButton.onclick = () => {
            // ★★★ ここが数学の核心！ 判別式 D = b^2 - 4ac ★★★
            //
            // 2次方程式 ax^2 + bx + c = 0 が解を持つかどうかを調べるための「魔法の数字」。
            // このプログラムでは、「放物線がコインの高さ(y=0)に届くか？」を判定している。
            //
            // D > 0: 解が2つ。放物線はy=0の直線と2回交わる (行きと帰りで2回チャンス！)。
            // D = 0: 解が1つ。放物線はy=0の直線にちょうど接する (ギリギリ届く！)。
            // D < 0: 解がない。放物線はy=0の直線に届かない…。
            const D = Math.pow(b, 2) - (4 * a * c);
            let resultHTML = `D = ${b}² - 4*(${a})*(${c}) = <strong>${D.toFixed(2)}</strong><br>`;
            
            if (D >= 0) {
                resultHTML += '<span style="color: blue;">D ≥ 0 なので、届く！</span>';
            } else {
                resultHTML += '<span style="color: red;">D < 0 なので、届かない…</span>';
            }
            discriminantResult.innerHTML = resultHTML;
        };
        
        function updateEquationDisplay() {
            const sign = c >= 0 ? '+' : '-';
            equationDisplay.innerHTML = `ジャンプの軌道 (2次関数): <code>y = ${a.toFixed(1)}x² + ${b.toFixed(1)}x ${sign} ${Math.abs(c).toFixed(1)}</code>`;
        }
        
        // --- 関数定義 ---
        function startJump() {
            if (isJumping) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.querySelectorAll('.coordinate-text, .coordinate-dot, .vertex-text, .vertex-dot, .landing-text, .landing-dot').forEach(el => el.remove());
            loggedIntegers = {};
            isVertexLogged = false;
            isLandingLogged = false;

            if (drawParabola) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(0, 0, 255, 0.7)';
                ctx.lineWidth = 3;
                const startY_css = GROUND_Y_PX;
                const startX_center = currentHorizontalPos + (character.offsetWidth / 2);
                const startY_center = canvas.height - startY_css - (character.offsetHeight / 2);
                ctx.moveTo(startX_center, startY_center);
            }
            
            if (showCoordinates) {
                const coordText = document.createElement('div');
                coordText.className = 'coordinate-text';
                coordText.innerText = `(0, ${c.toFixed(1)})`;
                const textX = currentHorizontalPos + character.offsetWidth;
                const textY = canvas.height - GROUND_Y_PX - character.offsetHeight;
                coordText.style.left = `${textX}px`;
                coordText.style.top = `${textY}px`;
                gameWorld.appendChild(coordText);
            }

            isJumping = true;
            x = 0;

            if (keysPressed['ArrowRight']) {
                jumpHorizontalVelocity = HORIZONTAL_SPEED;
            } else if (keysPressed['ArrowLeft']) {
                jumpHorizontalVelocity = -HORIZONTAL_SPEED;
            } else {
                jumpHorizontalVelocity = 0;
            }

            if (!animationFrameId) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }
        
        // ★★★ ゲームの心臓部（メインループ） ★★★
        function gameLoop() {
            if (isJumping) {
                currentHorizontalPos += jumpHorizontalVelocity;
            } else {
                if (keysPressed['ArrowLeft']) {
                    currentHorizontalPos -= HORIZONTAL_SPEED;
                }
                if (keysPressed['ArrowRight']) {
                    currentHorizontalPos += HORIZONTAL_SPEED;
                }
            }
            
            currentHorizontalPos = Math.max(0, Math.min(gameWorld.offsetWidth - character.offsetWidth, currentHorizontalPos));
            character.style.left = `${currentHorizontalPos}px`;

            if (isJumping) {
                x += 0.05;

                // ★★★ ここが数学の核心！ 2次関数を使ってジャンプの「相対的な高さ」を計算 ★★★
                // 教科書の式 y = ax^2 + bx + c がそのままコードになっている！
                let y = (a * Math.pow(x, 2)) + (b * x) + c;
                
                // 1. 先に着地判定(地面との衝突)を行い、yとxの最終値を確定させる
                // y_cssはキャラクターの視覚的な開始点(地面)からの高さの変化量
                let y_css = GROUND_Y_PX + ((y - c) * Y_SCALE);

                if (y_css < GROUND_Y_PX) {
                    y_css = GROUND_Y_PX;
                    isJumping = false;
                    jumpHorizontalVelocity = 0;
                }

                // 2. 確定したyの値を使ってキャラクターの見た目の位置を更新
                character.style.bottom = `${y_css}px`;

                // 3. 確定した位置情報を使って、放物線と座標点を描画
                if (drawParabola) {
                    const currentX_center = currentHorizontalPos + (character.offsetWidth / 2);
                    const currentY_center = canvas.height - y_css - (character.offsetHeight / 2);
                    ctx.lineTo(currentX_center, currentY_center);
                    ctx.stroke();
                }

                if (showCoordinates) {
                    // 頂点の表示ロジック
                    const vertexX = -b / (2 * a);
                    if (x >= vertexX && !isVertexLogged) {
                        const vertexY = (a * Math.pow(vertexX, 2)) + (b * vertexX) + c;
                        const vertexScreenX = (currentHorizontalPos - (jumpHorizontalVelocity * (x - vertexX) / 0.05));
                        const vertexScreenY_css = GROUND_Y_PX + ((vertexY - c) * Y_SCALE);
                        
                        const vertexText = document.createElement('div');
                        vertexText.className = 'vertex-text';
                        vertexText.innerText = `頂点 (${vertexX.toFixed(2)}, ${vertexY.toFixed(2)})`;
                        vertexText.style.left = `${vertexScreenX + character.offsetWidth}px`;
                        vertexText.style.top = `${canvas.height - vertexScreenY_css - character.offsetHeight}px`;
                        gameWorld.appendChild(vertexText);

                        const vertexDot = document.createElement('div');
                        vertexDot.className = 'vertex-dot';
                        vertexDot.style.left = `${vertexScreenX + (character.offsetWidth / 2)}px`;
                        vertexDot.style.top = `${canvas.height - vertexScreenY_css - (character.offsetHeight / 2)}px`;
                        gameWorld.appendChild(vertexDot);

                        isVertexLogged = true;
                    }
                    
                    // 整数点の表示ロジック
                    const currentIntX = Math.round(x);
                    if (currentIntX > 0 && Math.abs(x - currentIntX) < 0.05 && !loggedIntegers[currentIntX]) {
                        const intY = (a * Math.pow(currentIntX, 2)) + (b * currentIntX) + c;
                        
                        const coordText = document.createElement('div');
                        coordText.className = 'coordinate-text';
                        coordText.innerText = `(${currentIntX}, ${intY.toFixed(1)})`;
                        const textX = currentHorizontalPos + character.offsetWidth;
                        const textY = canvas.height - y_css - character.offsetHeight;
                        coordText.style.left = `${textX}px`;
                        coordText.style.top = `${textY}px`;
                        gameWorld.appendChild(coordText);
                        
                        const coordDot = document.createElement('div');
                        coordDot.className = 'coordinate-dot';
                        const dotX = currentHorizontalPos + (character.offsetWidth / 2);
                        const dotY = canvas.height - y_css - (character.offsetHeight / 2);
                        coordDot.style.left = `${dotX}px`;
                        coordDot.style.top = `${dotY}px`;
                        gameWorld.appendChild(coordDot);

                        loggedIntegers[currentIntX] = true;
                    }
                    
                    // 着地点の表示ロジック (ジャンプが終わった瞬間に一度だけ実行)
                    if (!isJumping && !isLandingLogged) {
                        const landingText = document.createElement('div');
                        landingText.className = 'landing-text';
                        landingText.innerText = `着地点 (y=${c.toFixed(1)})`; // 着地点は開始高さと同じ
                        const textX = currentHorizontalPos - landingText.offsetWidth - 5; 
                        const textY = canvas.height - GROUND_Y_PX - character.offsetHeight;
                        landingText.style.left = `${textX}px`;
                        landingText.style.top = `${textY}px`;
                        gameWorld.appendChild(landingText);

                        const landingDot = document.createElement('div');
                        landingDot.className = 'landing-dot';
                        const dotX = currentHorizontalPos + (character.offsetWidth / 2);
                        const dotY = canvas.height - GROUND_Y_PX - (character.offsetHeight / 2);
                        landingDot.style.left = `${dotX}px`;
                        landingDot.style.top = `${dotY}px`;
                        gameWorld.appendChild(landingDot);

                        isLandingLogged = true;
                    }
                }

                timeDisplay.innerText = x.toFixed(2);
                heightDisplay.innerText = y.toFixed(2);
            } else {
                heightDisplay.innerText = c.toFixed(2);
            }
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function resetJump() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.querySelectorAll('.coordinate-text, .coordinate-dot, .vertex-text, .vertex-dot, .landing-text, .landing-dot').forEach(el => el.remove());
            loggedIntegers = {};
            x = 0;
            isJumping = false;
            jumpHorizontalVelocity = 0;
            currentHorizontalPos = 50;
            character.style.left = `${currentHorizontalPos}px`;
            character.style.bottom = `${GROUND_Y_PX}px`; // 常に地面にリセット
            timeDisplay.innerText = '0.00';
            heightDisplay.innerText = c.toFixed(2);
            keysPressed = {};
            targetCoin.style.bottom = `${GROUND_Y_PX - (c * Y_SCALE)}px`;
        }

        updateEquationDisplay();
        resetJump();
        if (!animationFrameId) {
            animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
